kind = "web"
previewPath = "/"
title = "Integrated SME Management System"
description = "A full-stack business operations platform for Nigerian SMEs, combining inventory, sales and invoicing, expenses, financial reports, role-based access, and activity tracking in one system."
version = "1.0.0"
id = "artifacts/sme-management"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20786

[services.development]
run = "pnpm --filter @workspace/sme-management run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sme-management", "run", "build" ]
serve = "static"
publicDir = "artifacts/sme-management/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20786"
BASE_PATH = "/"
